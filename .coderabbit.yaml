# CodeRabbit configuration for reinaldosaraiva/frr fork (staging-review base).
#
# Purpose: pre-submit review of upstream-submit/* branches before opening the
# real PR to FRRouting/frr. Rules target NACK categories observed in past PRs
# and gaps observed in our own runs.
# Reference PRs: #21538 (wontfix), #21557 (wontfix), #21514 (amended),
#               #21051 (NACK over-engineered), #21459 (NACK too many changes),
#               #21296 (NACK NBC list key), #19480 (whitespace rejection).
# Reference runs: 4i-AJ smoke (caught sprintf + hardcoded -74),
#                 4i-AK UB-15+15b (caught mstate.ins partial-read carryover),
#                 4i-AM UB-14 B-light (zero findings — gap exposed: no
#                 concurrency-invariant instruction, no "demand test"
#                 instruction, docstring_coverage false-positive on C).
#
# This file lives on `staging-review` branch only. Upstream-submit branches
# stay clean so the config never leaks to FRRouting/frr.

language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: true
    base_branches:
      - staging-review

  # Pre-merge checks: `docstrings` is calibrated for Python PEP 257 and
  # false-positives on every C patch in this tree (validated empirically
  # on PR #5 UB-14, 2026-04-22 — 20% coverage warning on a 100% C patch).
  # Disabled here; re-enable per-branch if a pure-Python PR arrives.
  pre_merge_checks:
    docstrings:
      mode: off

  path_instructions:
    - path: "lib/**/*.h"
      instructions: |
        Flag any user-configure `#ifdef HAVE_*` guard (e.g. HAVE_SQLITE3,
        HAVE_LIBPCRE2_POSIX, HAVE_SYSREPO) being removed from a public
        struct member. FRR's build model expects all components compiled
        with the same `config.h`; "struct layout stability across configure
        flags" is not a supported use case (ref: PR #21538 wontfix,
        choppsv1 NACK 2026-04-21). OS-feature-detection guards
        (HAVE_PROC_NET_DEV, HAVE_NET_RT_IFLIST, HAVE_NETNS) are a distinct
        category and allowed.

        Flag any new inline comment in a header that re-documents standard
        library call semantics (listen(), read(), write(), memcpy(), etc.).
        Reviewers expect readers to know libc (ref: PR #21514, choppsv1
        requested removal of a listen() comment).

    - path: "lib/mgmt_*.h"
      instructions: |
        Flag any new symbolic constant, macro, or enum added without at
        least one in-tree caller in the same PR (ref: PR #21557 wontfix,
        Jafaral NACK: "defines errors values but I don't see those used").
        Header-only preparatory PRs require explicit justification and a
        linked follow-up PR that introduces consumers.

        Flag any `MGMT_MSG_ERR_*` or wire-protocol symbolic constant whose
        value is a hardcoded errno integer (e.g. -74 for EBADMSG).
        Errno numeric values are NOT portable across libcs: Darwin, Linux
        glibc, musl, and FreeBSD all diverge. Hardcoding Linux values under
        FRR-owned names is an error (ref: PR #21557, choppsv1 NACK
        2026-04-21; empirical: 4/11 errno values diverge Darwin vs Linux
        glibc). If a stable wire contract is needed, an FRR-owned enum
        with local errno-to-enum translation is the correct shape.

    - path: "mgmtd/**/*.c"
      instructions: |
        Flag any change to YANG list key definitions. Silently changing
        keys breaks YANG NBC (non-backward-compat) for anyone configuring
        FRR via direct YANG (ref: PR #21296, choppsv1 NACK).

        Flag any duplication of an output function between JSON and
        non-JSON variants. Single output path avoids drift bugs (ref:
        choppsv1 pattern referenced in #21232).

    - path: "mgmtd/mgmt_txn*.[ch]"
      instructions: |
        This file carries CONFIG-txn locking, admission gating, and
        finishing-slot lifecycle logic. Patches here almost always change
        shared-state semantics even when the diff is small.

        Review MUST explicitly address each of the following before
        returning "No actionable comments":

        (1) Overlap window. Name every mgmtd global or singleton the old
            and new txn can touch concurrently after any lock/gate is
            released early. Cite file:line for each shared symbol.
            Patches changing `config_active_txn`, `txn_config_txn`,
            `mgmt_create_txn`, `txn_req_free`, `mgmt_ds_*_lock` are
            in-scope (ref: UB-14 narrowing, empirical lab regression
            2026-04-22).

        (2) Refcount integrity under delayed teardown. If a global is
            cleared before the txn's refcount drops, verify no late
            backend reply or subscriber callback dereferences the old
            txn via that global.

        (3) Error cascade. Between any early unlock and the FE reply, if
            `mgmt_fe_send_*_reply` fails or the session is gone
            (`-ENOENT`), is cleanup of the pre-cleared DS locks still
            reached? Before/after behaviour must match on the error path.

        (4) Event-loop yield points. FRR daemons run on a single libevent
            loop; the only preemption is at yield points. Identify which
            (if any) of the mutation steps yield, and whether another
            txn's admission path can observe a half-completed state.

        (5) Test coverage. For any patch that narrows or widens a
            critical section, releases a global singleton earlier, or
            otherwise changes the invariant that governs concurrent
            execution, flag absence of a regression test that exercises
            the new invariant directly. Aggregate throughput / latency
            benches do NOT count. An overlap-or-serialisation-observable
            test (e.g. asymmetric-payload wall-clock — see
            `tests/topotests/mgmt_config/test_pipelined_commits.py`)
            does count.

    - path: "doc/user/**"
      instructions: |
        Flag any DOC block that exceeds ~30 lines without a compelling
        rationale in the commit body. donaldsharp rejected a 59-line DOC
        block in #21557 as "stupidly over the top." Prefer linking to
        docs.frrouting.org or keeping rationale in the commit message.

    - path: "**/*.c"
      instructions: |
        Flag whitespace-only or cosmetic diff chunks mixed into a
        functional PR (ref: PR #19480, #20031, #18436 — Jafaral repeatedly
        requested drops of whitespace-only changes). Cosmetic fixes
        belong in a separate commit or PR.

        Flag the use of banned libc functions: `sprintf`, `strcat`,
        `strcpy`, `inet_ntoa`, `ctime`. FRR requires `snprintf`,
        `strlcat`, `strlcpy`, `inet_ntop`, `ctime_r` (ref: PR #18436,
        Jafaral inline).

        If the commit message claims a new behavioural invariant
        (pipelining, early unlock, reordered state transitions, narrowed
        critical section, relaxed ordering), flag absence of a regression
        test that exercises the invariant itself. Reconciler or micro-
        benchmark aggregate throughput is NOT sufficient evidence — the
        test must be structured so a future revert of the patch makes it
        fail. A positive-invariant assertion (e.g. "B finishes before A
        when payloads are asymmetric") is the standard; coexistence in
        running-config alone is not.

  # Static analysis tools. Keep the set narrow and aligned with what FRR
  # code touches in practice: C/C++, shell, yaml, GitHub Actions. Each
  # tool here produces signal on its own layer; the LLM review above is
  # orthogonal and not a substitute.
  tools:
    cppcheck:
      enabled: true
    clang:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    markdownlint:
      enabled: true

  path_filters:
    - "!tests/topotests/**/r*/*.conf"
    - "!docs/**/*.rst"
    - "!*.md"

tone_instructions: |
  Write as an engineer at a keyboard reviewing a colleague's patch.
  Direct, technical, concise. Cite PR numbers or line refs when flagging
  a known pattern. No emoji. Keep inline comments shorter than the diff
  they reference.

# Learnings scope: repo-local so the knowledge accumulated across staging
# reviews stays with this fork and doesn't leak into an org-wide pool.
knowledge_base:
  learnings:
    scope: "local"

chat:
  auto_reply: false
